# Copy to .github/workflows/duoready.yml in your app's repository.
# Replace YOUR_ORG and pin the action to a full commit SHA for production use.
name: DuoReady

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: YOUR_ORG/duoready@v0.1.0
        with:
          path: .
          severity: error
          format: github
