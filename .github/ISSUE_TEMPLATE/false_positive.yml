name: False positive
description: DuoReady flagged code that is actually fine.
labels: ["false positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: DR002
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Smallest code that reproduces it
      render: swift
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this code is correct
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: duoready version
      placeholder: Output of `duoready version`
